name: Mobile E2E Test Automation CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile Verification
        run: npm run typecheck

  android-tests:
    name: Android E2E Tests (API 34)
    needs: code-quality
    runs-on: macos-13 # macOS runner allows hardware acceleration (HAXM/KVM)
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Appium 2 & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Android Automated Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: npm run test:android

      - name: Upload Android Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-allure-results
          path: allure-results/
          retention-days: 14

  ios-tests:
    name: iOS E2E Tests (iOS 17.4 Simulator)
    needs: code-quality
    runs-on: macos-14
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Appium 2 & XCUITest Driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Run iOS Automated Tests
        run: npm run test:ios

      - name: Upload iOS Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-allure-results
          path: allure-results/
          retention-days: 14

  publish-report:
    name: Publish Allure Test Report
    if: always()
    needs: [ android-tests, ios-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          path: combined-allure-results

      - name: Merge and Generate Allure HTML Report
        run: |
          npm install -g allure-commandline
          mkdir -p allure-results
          cp -r combined-allure-results/*/* allure-results/ || true
          allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

